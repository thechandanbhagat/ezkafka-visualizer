apiVersion: apps/v1
kind: Deployment
metadata:
  name: ezkafka-visualizer
  namespace: ezkafka-visualizer
  labels:
    app: ezkafka-visualizer
spec:
  # Settings and inspection sessions are process-local; run one replica.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ezkafka-visualizer
  template:
    metadata:
      labels:
        app: ezkafka-visualizer
    spec:
      securityContext:
        fsGroup: 1001
      containers:
      - name: ezkafka-visualizer
        image: ezkafka-visualizer:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3700
          protocol: TCP
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: ezkafka-visualizer-config
              key: NODE_ENV
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: ezkafka-visualizer-config
              key: PORT
        - name: HOSTNAME
          valueFrom:
            configMapKeyRef:
              name: ezkafka-visualizer-config
              key: HOSTNAME
        - name: KAFKA_BROKERS
          valueFrom:
            configMapKeyRef:
              name: ezkafka-visualizer-config
              key: KAFKA_BROKERS
        - name: KAFKA_CLIENT_ID
          valueFrom:
            configMapKeyRef:
              name: ezkafka-visualizer-config
              key: KAFKA_CLIENT_ID
        - name: EZKAFKA_PUBLIC_ORIGIN
          valueFrom:
            configMapKeyRef:
              name: ezkafka-visualizer-config
              key: EZKAFKA_PUBLIC_ORIGIN
        - name: EZKAFKA_CONFIG_PATH
          value: /app/data/settings.json
        - name: EZKAFKA_ADMIN_USERNAME
          valueFrom:
            secretKeyRef:
              name: ezkafka-visualizer-auth
              key: admin-username
        - name: EZKAFKA_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ezkafka-visualizer-auth
              key: admin-password
        - name: EZKAFKA_READONLY_USERNAME
          valueFrom:
            secretKeyRef:
              name: ezkafka-visualizer-auth
              key: readonly-username
              optional: true
        - name: EZKAFKA_READONLY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ezkafka-visualizer-auth
              key: readonly-password
              optional: true
        volumeMounts:
        - name: configuration
          mountPath: /app/data
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          tcpSocket:
            port: 3700
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 3700
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: configuration
        persistentVolumeClaim:
          claimName: ezkafka-visualizer-data
      restartPolicy: Always
