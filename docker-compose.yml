services:
  # @group Configuration > Application : Versioned image with authenticated access and persistent settings
  ezkafka-visualizer:
    image: chandanbhagat/ezkafka-visualizer:${EZKAFKA_VERSION:-1.1.0}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - PORT=${APP_PORT:-3700}
        - APP_VERSION=${EZKAFKA_VERSION:-1.1.0}
        - VCS_REF=${VCS_REF:-unknown}
    ports:
      - "127.0.0.1:${HOST_PORT:-3700}:${APP_PORT:-3700}"
    environment:
      - NODE_ENV=production
      - PORT=${APP_PORT:-3700}
      - HOSTNAME=0.0.0.0
      - KAFKA_BROKERS=${KAFKA_BROKERS:-kafka:29092}
      - KAFKA_CLIENT_ID=${KAFKA_CLIENT_ID:-ezkafka-visualizer}
      - KAFKA_CONNECTION_TIMEOUT=${KAFKA_CONNECTION_TIMEOUT:-3000}
      - KAFKA_REQUEST_TIMEOUT=${KAFKA_REQUEST_TIMEOUT:-30000}
      - EZKAFKA_ADMIN_USERNAME=${EZKAFKA_ADMIN_USERNAME:?Set an administrator username}
      - EZKAFKA_ADMIN_PASSWORD=${EZKAFKA_ADMIN_PASSWORD:?Set a strong administrator password}
      - EZKAFKA_READONLY_USERNAME=${EZKAFKA_READONLY_USERNAME:-}
      - EZKAFKA_READONLY_PASSWORD=${EZKAFKA_READONLY_PASSWORD:-}
      - EZKAFKA_PUBLIC_ORIGIN=${EZKAFKA_PUBLIC_ORIGIN:?Set the exact browser origin, such as http://localhost:3700}
      - EZKAFKA_CONFIG_PATH=/app/data/settings.json
    volumes:
      - visualizer-data:/app/data
    depends_on:
      - kafka
    networks:
      - kafka-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    networks:
      - kafka-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - kafka-network

volumes:
  visualizer-data:
  kafka-data:
  zookeeper-data:
  zookeeper-logs:

networks:
  kafka-network:
    driver: bridge
